<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyTracker — Fortnite Stats</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#090909;color:#fff;
  font-family:Arial,sans-serif;min-height:100vh
}
header{
  height:75px;border-bottom:1px solid #292929;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 7%;background:#101010
}
.logo{font-size:25px;font-weight:900;letter-spacing:1px}
.logo span{color:#ff3030}
.status{color:#aaa;font-size:13px}
main{max-width:1100px;margin:55px auto;padding:0 20px}
.hero{text-align:center;margin-bottom:40px}
.hero h1{font-size:42px;margin-bottom:12px}
.hero h1 span{color:#ff3030}
.hero p{color:#999}
.search-box{
  max-width:750px;margin:30px auto;padding:22px;
  background:#141414;border:1px solid #292929;
  border-radius:14px
}
label{display:block;color:#bbb;font-size:13px;margin-bottom:9px}
.controls{display:flex;gap:10px}
input,select{
  background:#090909;color:white;border:1px solid #333;
  padding:15px;border-radius:8px;font-size:15px;min-width:0
}
input{flex:1}
select{width:125px}
button{
  background:#ff3030;color:white;border:0;
  padding:0 22px;border-radius:8px;font-weight:bold;
  cursor:pointer
}
button:hover{background:#d91f1f}
#message{text-align:center;color:#aaa;margin-top:17px;font-size:14px}
.section-title{font-size:21px;margin:35px 0 17px}
.cards{
  display:grid;grid-template-columns:repeat(4,1fr);gap:15px
}
.card{
  background:#141414;border:1px solid #292929;
  padding:22px;border-radius:12px
}
.card p{color:#999;font-size:13px;margin-bottom:12px}
.card h2{font-size:27px}
.results{
  background:#141414;border:1px solid #292929;
  border-radius:12px;padding:22px;margin-top:20px;
  display:none
}
.results pre{
  white-space:pre-wrap;overflow-wrap:anywhere;
  color:#ddd;font-size:13px;line-height:1.6
}
footer{text-align:center;color:#666;padding:45px 15px;font-size:12px}
@media(max-width:650px){
  .hero h1{font-size:31px}
  .controls{flex-wrap:wrap}
  input{width:100%;flex-basis:100%}
  select{flex:1}
  button{height:48px;flex:1}
  .cards{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<header>
  <div class="logo">MY<span>TRACKER</span></div>
  <div class="status">● FORTNITE TRACKER</div>
</header>

<main>
  <section class="hero">
    <h1>TRACK YOUR <span>GAME.</span></h1>
    <p>Bekijk je Fortnite-statistieken op één plek.</p>
  </section>

  <section class="search-box">
    <label>ZOEK EEN FORTNITE SPELER</label>
    <div class="controls">
      <input id="player" placeholder="Vul Epic gebruikersnaam in">
      <select id="platform">
        <option value="epic">Epic</option>
        <option value="psn">PlayStation</option>
        <option value="xbl">Xbox</option>
      </select>
      <button onclick="searchPlayer()">ZOEK</button>
    </div>
    <div id="message">Vul een spelersnaam in om te beginnen.</div>
  </section>

  <h2 class="section-title">PLAYER STATISTICS</h2>

  <section class="cards">
    <div class="card"><p>WINS</p><h2 id="wins">—</h2></div>
    <div class="card"><p>KILLS</p><h2 id="kills">—</h2></div>
    <div class="card"><p>K/D</p><h2 id="kd">—</h2></div>
    <div class="card"><p>WIN RATE</p><h2 id="winrate">—</h2></div>
  </section>

  <section class="results" id="results">
    <h2 class="section-title">PLAYER DATA</h2>
    <pre id="rawdata"></pre>
  </section>
</main>

<footer>MYTRACKER © 2026 — UNOFFICIAL FORTNITE TRACKER</footer>

<script>
async function searchPlayer(){
  const name=document.getElementById("player").value.trim();
  const platform=document.getElementById("platform").value;
  const message=document.getElementById("message");
  const results=document.getElementById("results");

  if(!name){
    message.textContent="Vul eerst een spelersnaam in.";
    return;
  }

  message.textContent="Speler zoeken...";
  results.style.display="none";

  try{
    const response=await fetch(
      `/api/player?name=${encodeURIComponent(name)}&platform=${platform}`
    );
    const result=await response.json();

    if(!response.ok){
      throw new Error(result.error||"Speler niet gevonden.");
    }

    const stats=result.data?.stats?.all?.overall
      ||result.data?.stats?.all?.solo
      ||{};

    document.getElementById("wins").textContent=stats.wins??"—";
    document.getElementById("kills").textContent=stats.kills??"—";
    document.getElementById("kd").textContent=stats.kd??"—";
    document.getElementById("winrate").textContent=
      stats.winRate!=null?stats.winRate+"%":"—";

    document.getElementById("rawdata").textContent=
      JSON.stringify(result.data,null,2);

    results.style.display="block";
    message.textContent="Spelergegevens geladen!";
  }catch(error){
    message.textContent="Fout: "+error.message;
  }
}
</script>

</body>
</html>
