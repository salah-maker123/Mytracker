<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyTracker - Fortnite Stats</title>

<style>
:root {
  --red: #e10600;
  --bg: #090909;
  --card: #141414;
  --border: #262626;
  --text: #fff;
  --muted: #888;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
  min-height: 100vh;
  padding-bottom: 85px;
}

header {
  height: 70px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 7%;
  border-bottom: 1px solid var(--border);
}

.logo {
  font-size: 24px;
  font-weight: 900;
}

.logo span {
  color: var(--red);
}

.status {
  color: #aaa;
  font-size: 12px;
}

.status::before {
  content: "";
  display: inline-block;
  width: 7px;
  height: 7px;
  background: #20d66b;
  border-radius: 50%;
  margin-right: 7px;
}

main {
  max-width: 1000px;
  margin: auto;
  padding: 55px 20px;
}

.hero {
  text-align: center;
  margin-bottom: 35px;
}

.hero h1 {
  font-size: clamp(32px, 7vw, 55px);
  font-weight: 900;
  margin-bottom: 12px;
}

.hero h1 span {
  color: var(--red);
}

.hero p {
  color: var(--muted);
  font-size: 14px;
}

.search {
  max-width: 600px;
  margin: auto;
  display: flex;
  gap: 10px;
}

.search input {
  flex: 1;
  min-width: 0;
  background: #171717;
  border: 1px solid #333;
  border-radius: 10px;
  padding: 17px;
  color: white;
  font-size: 15px;
  outline: none;
}

.search input:focus {
  border-color: var(--red);
}

button {
  border: none;
  cursor: pointer;
  color: white;
  font-weight: bold;
}

.search button {
  background: var(--red);
  padding: 0 24px;
  border-radius: 10px;
  font-size: 14px;
}

.search button:disabled {
  opacity: .5;
}

.platforms {
  display: flex;
  justify-content: center;
  gap: 9px;
  margin: 17px 0 30px;
  flex-wrap: wrap;
}

.platforms button,
.mode-tabs button {
  background: #171717;
  border: 1px solid #333;
  padding: 9px 15px;
  border-radius: 8px;
  color: #aaa;
}

.platforms button.active,
.mode-tabs button.active {
  background: #35100f;
  border-color: var(--red);
  color: white;
}

.message {
  text-align: center;
  color: #aaa;
  margin: 20px 0;
  font-size: 14px;
}

.error {
  color: #ff6969;
}

.profile {
  display: none;
  margin-top: 35px;
}

.profile-top {
  background: linear-gradient(120deg, #25100f, #151515 65%);
  border: 1px solid #42201f;
  border-radius: 16px;
  padding: 25px;
  display: flex;
  align-items: center;
  gap: 20px;
  margin-bottom: 20px;
}

.avatar {
  width: 85px;
  height: 85px;
  border-radius: 15px;
  object-fit: cover;
  background: var(--red);
}

.avatar-fallback {
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 35px;
  font-weight: bold;
}

.player-name {
  font-size: 25px;
  font-weight: 900;
  overflow-wrap: anywhere;
}

.player-platform {
  color: #aaa;
  margin-top: 7px;
  font-size: 13px;
}

.level {
  color: #ff7772;
  margin-top: 8px;
  font-size: 13px;
}

.mode-tabs {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  margin: 22px 0;
  padding-bottom: 5px;
}

.mode-tabs button {
  white-space: nowrap;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 13px;
}

.stat-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  min-width: 0;
}

.stat-card .label {
  color: var(--muted);
  font-size: 12px;
  margin-bottom: 13px;
}

.stat-card .value {
  font-size: clamp(21px, 4vw, 29px);
  font-weight: 900;
  overflow-wrap: anywhere;
}

.stat-card.highlight {
  border-color: #63201e;
  background: linear-gradient(140deg, #24100f, #141414);
}

.section-title {
  font-size: 17px;
  margin: 28px 0 14px;
}

.share {
  width: 100%;
  padding: 15px;
  margin-top: 20px;
  border-radius: 9px;
  background: #202020;
  border: 1px solid #333;
}

.share:hover {
  border-color: var(--red);
}

footer {
  text-align: center;
  color: #666;
  font-size: 11px;
  padding: 25px 15px;
}

.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: #111;
  border-top: 1px solid #292929;
  display: flex;
  justify-content: space-around;
  padding: 13px 5px calc(13px + env(safe-area-inset-bottom));
}

.bottom-nav button {
  background: none;
  color: #888;
  font-size: 12px;
}

.bottom-nav button:first-child {
  color: var(--red);
}

@media (max-width: 600px) {
  header {
    padding: 0 18px;
  }

  main {
    padding: 42px 15px;
  }

  .search {
    flex-direction: column;
  }

  .search button {
    padding: 16px;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 9px;
  }

  .stat-card {
    padding: 15px;
  }

  .profile-top {
    padding: 17px;
  }

  .avatar {
    width: 70px;
    height: 70px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">MY<span>TRACKER</span></div>
  <div class="status">Online</div>
</header>

<main>

  <section class="hero">
    <h1>YOUR STATS.<br><span>YOUR LEGACY.</span></h1>
    <p>Bekijk jouw Fortnite-statistieken.</p>
  </section>

  <div class="search">
    <input
      id="playerInput"
      type="text"
      maxlength="32"
      placeholder="Vul je Epic Games naam in..."
      autocomplete="off"
    >
    <button id="searchButton" onclick="searchPlayer()">ZOEKEN</button>
  </div>

  <div class="platforms">
    <button class="active" data-platform="auto">Auto</button>
    <button data-platform="epic">Epic Games</button>
    <button data-platform="psn">PlayStation</button>
    <button data-platform="xbl">Xbox</button>
  </div>

  <div id="message" class="message">
    Zoek een Fortnite-speler om te beginnen.
  </div>

  <section id="profile" class="profile">

    <div class="profile-top">
      <div id="avatar" class="avatar avatar-fallback">?</div>

      <div>
        <div id="playerName" class="player-name">Player</div>
        <div id="playerPlatform" class="player-platform"></div>
        <div id="playerLevel" class="level"></div>
      </div>
    </div>

    <div id="modeTabs" class="mode-tabs"></div>

    <h2 class="section-title">Battle Royale Statistics</h2>

    <div id="statsGrid" class="stats-grid"></div>

    <button class="share" onclick="shareProfile()">
      Deel dit profiel
    </button>

  </section>

</main>

<footer>
  MyTracker is niet verbonden aan of goedgekeurd door Epic Games.
</footer>

<nav class="bottom-nav">
  <button onclick="window.scrollTo({top:0,behavior:'smooth'})">⌂ Home</button>
  <button onclick="document.getElementById('playerInput').focus()">⌕ Search</button>
  <button onclick="comingSoon()">⇄ Compare</button>
  <button onclick="comingSoon()">★ Leaderboards</button>
</nav>

<script>
let selectedPlatform = "auto";
let currentPlayer = "";
let currentMatches = [];
let currentMode = "overall";

const platformNames = {
  epic: "Epic Games",
  psn: "PlayStation",
  xbl: "Xbox"
};

document.querySelectorAll(".platforms button").forEach(button => {
  button.addEventListener("click", () => {
    document.querySelectorAll(".platforms button").forEach(b => {
      b.classList.remove("active");
    });

    button.classList.add("active");
    selectedPlatform = button.dataset.platform;
  });
});

document.getElementById("playerInput").addEventListener("keydown", event => {
  if (event.key === "Enter") searchPlayer();
});

function showMessage(text, isError = false) {
  const message = document.getElementById("message");
  message.textContent = text;
  message.className = isError ? "message error" : "message";
}

async function searchPlayer() {
  const name = document.getElementById("playerInput").value.trim();
  const button = document.getElementById("searchButton");

  if (!name) {
    showMessage("Vul eerst een spelersnaam in.", true);
    return;
  }

  currentPlayer = name;
  button.disabled = true;
  button.textContent = "ZOEKEN...";
  document.getElementById("profile").style.display = "none";
  showMessage("Fortnite-statistieken ophalen...");

  try {
    const response = await fetch(
      `/api/player?name=${encodeURIComponent(name)}&platform=${selectedPlatform}`
    );

    const result = await response.json();

    if (!response.ok) {
      const errors = {
        PLAYER_NOT_FOUND: "Speler niet gevonden. Controleer de naam.",
        API_FORBIDDEN: "De API heeft dit verzoek geweigerd.",
        RATE_LIMIT: "Te veel verzoeken. Probeer het later opnieuw.",
        API_KEY_MISSING: "De Fortnite API-key ontbreekt op de server.",
        API_ERROR: "Er ging iets mis bij het ophalen van de statistieken.",
        SERVER_ERROR: "Er ging iets mis op de server."
      };

      throw new Error(errors[result.error] || result.error || "Onbekende fout.");
    }

    if (!result.matches || result.matches.length === 0) {
      throw new Error("Geen Fortnite-account gevonden.");
    }

    currentMatches = result.matches;

    if (currentMatches.length > 1) {
      showPlatformChoices();
    } else {
      displayPlayer(currentMatches[0]);
    }

  } catch (error) {
    showMessage(error.message, true);
  } finally {
    button.disabled = false;
    button.textContent = "ZOEKEN";
  }
}

function showPlatformChoices() {
  const message = document.getElementById("message");
  message.className = "message";
  message.textContent = "Meerdere accounts gevonden. Kies je platform:";

  const choices = document.createElement("div");
  choices.className = "platforms";

  currentMatches.forEach(match => {
    const button = document.createElement("button");
    button.textContent = platformNames[match.platform] || match.platform;
    button.onclick = () => displayPlayer(match);
    choices.appendChild(button);
  });

  message.appendChild(choices);
}

function displayPlayer(match) {
  const data = match.data || {};

  document.getElementById("profile").style.display = "block";
  document.getElementById("message").textContent = "";

  document.getElementById("playerName").textContent =
    data.account?.name || currentPlayer;

  document.getElementById("playerPlatform").textContent =
    platformNames[match.platform] || match.platform;

  const level = data.battlePass?.level;

  document.getElementById("playerLevel").textContent =
    level ? "Battle Pass level " + level : "";

  const avatar = document.getElementById("avatar");
  avatar.textContent = (currentPlayer[0] || "?").toUpperCase();
  avatar.className = "avatar avatar-fallback";

  currentMode = "overall";
  renderModes(data.stats);
  renderStats(data.stats, currentMode);

  document.getElementById("profile").scrollIntoView({
    behavior: "smooth",
    block: "start"
  });

  const url = new URL(window.location.href);
  url.searchParams.set("name", currentPlayer);
  history.replaceState({}, "", url);
}

function getAvailableModes(stats) {
  const all = stats?.all || {};
  const modes = ["overall", "solo", "duo", "squad"];

  return modes.filter(mode => {
    if (mode === "overall") return !!all.overall;
    return !!all[mode];
  });
}

function renderModes(stats) {
  const container = document.getElementById("modeTabs");
  container.innerHTML = "";

  const modes = getAvailableModes(stats);

  modes.forEach(mode => {
    const button = document.createElement("button");
    button.textContent = mode.toUpperCase();
    button.classList.toggle("active", mode === currentMode);

    button.onclick = () => {
      currentMode = mode;

      container.querySelectorAll("button").forEach(b => {
        b.classList.remove("active");
      });

      button.classList.add("active");
      renderStats(stats, mode);
    };

    container.appendChild(button);
  });
}

function formatNumber(value) {
  if (value === null || value === undefined || !Number.isFinite(Number(value))) {
    return "—";
  }

  return Number(value).toLocaleString("nl-NL", {
    maximumFractionDigits: 2
  });
}

function renderStats(stats, mode) {
  const grid = document.getElementById("statsGrid");
  grid.innerHTML = "";

  const values = mode === "overall"
    ? stats?.all?.overall
    : stats?.all?.[mode];

  if (!values) {
    grid.textContent = "Geen statistieken beschikbaar voor deze modus.";
    return;
  }

  const cards = [
    ["Wins", values.wins, true],
    ["Kills", values.kills, true],
    ["K/D", values.kd, true],
    ["Win Rate", values.winRate, true, "%"],
    ["Matches", values.matches, false],
    ["Minutes Played", values.minutesPlayed, false],
    ["Top 3", values.top3, false],
    ["Top 5", values.top5, false],
    ["Top 10", values.top10, false],
    ["Kills per Match", values.killsPerMatch, false],
    ["Score", values.score, false],
    ["Score per Match", values.scorePerMatch, false]
  ];

  let shown = 0;

  cards.forEach(([label, value, highlight, suffix = ""]) => {
    if (value === null || value === undefined) return;

    const card = document.createElement("div");
    card.className = "stat-card" + (highlight ? " highlight" : "");

    const title = document.createElement("div");
    title.className = "label";
    title.textContent = label;

    const number = document.createElement("div");
    number.className = "value";
    number.textContent = formatNumber(value) + suffix;

    card.appendChild(title);
    card.appendChild(number);
    grid.appendChild(card);

    shown++;
  });

  if (shown === 0) {
    grid.textContent = "Geen statistieken beschikbaar.";
  }
}

async function shareProfile() {
  const url = window.location.href;

  try {
    if (navigator.share) {
      await navigator.share({
        title: "MyTracker Fortnite Stats",
        url
      });
    } else {
      await navigator.clipboard.writeText(url);
      alert("Profiel-link gekopieerd!");
    }
  } catch (error) {
    console.log("Delen geannuleerd.");
  }
}

function comingSoon() {
  alert("Deze functie komt binnenkort!");
}

const params = new URLSearchParams(window.location.search);
const playerFromUrl = params.get("name");

if (playerFromUrl) {
  document.getElementById("playerInput").value = playerFromUrl;
  searchPlayer();
}
</script>

</body>
</html>
